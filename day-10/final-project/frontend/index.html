<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hygiene Risk Predictor</title><style>body{font:16px Arial;background:#f3f6fb;margin:0}main{max-width:720px;margin:35px auto;padding:22px;background:#fff;border-radius:12px}form{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,button{padding:11px;border:1px solid #bbc7d7;border-radius:6px}button{grid-column:1/-1;background:#2563eb;color:white;cursor:pointer}#result{margin-top:20px;padding:14px;background:#eef4ff;border-radius:8px}</style></head><body><main><h1>Smart Hygiene Risk Predictor</h1><p>Enter facility inspection values to receive a decision-support risk estimate.</p><form id="form"><input name="cleanliness_score" type="number" min="0" max="10" step=".1" placeholder="Cleanliness score" required><input name="odor_score" type="number" min="0" max="10" step=".1" placeholder="Odor score" required><input name="waste_level" type="number" min="0" max="10" step=".1" placeholder="Waste level" required><input name="complaints" type="number" min="0" placeholder="Complaints" required><input name="footfall" type="number" min="0" placeholder="Footfall" required><input name="hours_since_cleaning" type="number" min="0" step=".1" placeholder="Hours since cleaning" required><button>Predict risk</button></form><div id="result">Result will appear here.</div></main><script>document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));Object.keys(d).forEach(k=>d[k]=Number(d[k]));const out=document.querySelector('#result');try{const r=await fetch('http://localhost:8000/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const x=await r.json();out.textContent=r.ok?`Risk: ${x.hygiene_risk} | High-risk probability: ${(x.high_risk_probability*100).toFixed(1)}%`:x.detail}catch{out.textContent='Could not contact API. Start the FastAPI backend.'}}</script></body></html>
